$kind: http-request
name: api/misc/cron
url: "{{baseUrl}}{{stage}}/admin/api/misc/cron"
method: POST
body:
  type: json
  content: |-
    // {"usecase": "refresh_activity_availabilities"}
    {"usecase": "refresh_instructor_availabilities"}
    // {"usecase": "pass_expiry_email"}
    // {"usecase": "delete_expired_pass"}
    // {"usecase": "credits_expiry_email"}
    // {"usecase": "deduct_expired_credits"}
headers:
  # Still required on prod until the IAM cron change is released there; ignored on dev.
  - key: x-api-key
    value: "{{vault:x10s-api-key}}"
auth:
  type: awsv4
  credentials:
    accessKey: "{{vault:aws-access-key-id}}"
    secretKey: "{{vault:aws-secret-access-key}}"
    sessionToken: "{{vault:aws-session-token}}"
    region: ap-southeast-1
    service: execute-api
order: 2000
