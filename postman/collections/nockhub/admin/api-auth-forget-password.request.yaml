$kind: http-request
name: api/auth/forget-password
description: "Emails a 1-hour reset-password link. `portal`: admin | member — both looked up by `email`."
url: "{{baseUrl}}{{stage}}/admin/api/auth/forget-password"
method: POST
body:
  type: json
  content: |-
    {
        "portal": "member",
        "email": "<email>"
    }
auth:
  type: noauth
order: 8000
