$kind: http-request
name: api/auth/reset-password
description: "Sets a new password using the `token` from the forget-password email link. `portal`: admin | member. `new_password`: min 8 chars."
url: "{{baseUrl}}{{stage}}/admin/api/auth/reset-password"
method: POST
body:
  type: json
  content: |-
    {
        "portal": "member",
        "token": "<token-from-reset-email>",
        "new_password": "<new-password>"
    }
auth:
  type: noauth
order: 9000
