$kind: http-request
name: api/auth/change-password
description: "Member portal only. Account comes from the `member_token` cookie (run member login first so Postman holds the cookie). Wrong `old_password` → 403; same old/new → 400. `new_password`: min 8 chars."
url: "{{baseUrl}}{{stage}}/admin/api/auth/change-password"
method: POST
body:
  type: json
  content: |-
    {
        "portal": "member",
        "old_password": "<old-password>",
        "new_password": "<new-password>"
    }
auth:
  type: noauth
order: 10000
