$kind: http-request
name: api/payment - re-proceed
url: "{{baseUrl}}{{stage}}/guest/api/payment"
method: POST
body:
  type: json
  content: |-
    {
        // Re-Proceed: the reserve_id + payment_request_id returned by the previous
        // api/payment POST. Honoured only while that reserve is pending and unexpired;
        // otherwise ignored and a new reserve is created. Either way the old HitPay
        // request is cancelled and a new one returned.
        // Same sessions + pax as before -> the reserve is reused (expire_on unchanged).
        // Different sessions -> old slots refunded, new ones deducted, expire_on reset.
        "reserve_id": {{reserveId}},
        "payment_request_id": "{{paymentRequestId}}",
        "activity_id": 3,
        "location_id": 1,
        "pkg_id": 12, // 10 to 15
        "num_child": 3,
        "num_adult": 3,
        "participants": [{
            "name": "Test Live",
            "ext": "+65",
            "phone": "91231234",
            "email": "newattempt@outlook.com"
        }],
        "sessions": [{
            "date": "2026-02-10",
            "start_hour": 10,
            "end_hour": 11,
            "availability_info": {
                "range_id": 1,
                "ra_id": [131],
                "ra_by": 3,
                "ra_adjust": "lane",
                "ia_id": [131],
                "ia_by": 1
            }
        }],
        "amount": 10.10,
        "payment_method": "card",
        "payment_platform": "hitpay"
    }
auth:
  type: apikey
  credentials:
    key: x-api-key
    value: "{{vault:x10s-api-key}}"
order: 5500
