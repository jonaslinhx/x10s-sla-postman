$kind: http-example
request:
  url: "{{baseUrl}}/admin/api/bookings/booking"
  method: POST
  body:
    type: json
    content: |-
      {
          "booing_mode": "direct",
          "booking_code": "EV",
          "comment": "postman private coaching existing timeslot",
          "payment_mode": "credit",
          "user_id": 16,     
          "activity_id": 13, // Private Coaching (Recurve)
          "date": "2025-09-10",
          "start_hour": 10,
          "end_hour": 11,
          "availability_info": {
              "range_id": 2,
              "ra_id": [1022],
              "ra_adjust": "lane",
