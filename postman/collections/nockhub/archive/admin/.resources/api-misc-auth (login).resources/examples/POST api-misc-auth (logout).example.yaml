$kind: http-example
name: POST api/misc/auth (logout)
request:
  url: "{{baseUrl}}{{stage}}/admin/api/misc/auth"
  method: POST
  headers:
    - key: ""
      value: ""
      disabled: true
  body:
    type: json
    content: |-
      {
          "access_key": "{{accessKey}}"
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 2000
